<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Fallback robusto para TV: recarga completa cada 3min aunque el JS falle.
     La recarga normal la maneja el JS: 07:30 · 10:30 · 13:30 · 16:00 -->
<meta http-equiv="refresh" content="180">
<title>Cinzia · Pie de Línea TV</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;background:#f4f4f5;color:#1f2937;font-size:16px}
.hdr{background:#EA580C;color:#fff;padding:5px 14px;overflow:hidden}
.hdr .tit{font-size:19px;font-weight:bold;float:left}
.hdr .tit .a{color:#ffd9c2}
.hdr .sub{font-size:11px;opacity:.9;clear:left;float:left}
.clock{float:right;font-size:22px;font-weight:bold}
.nextref{float:right;clear:right;font-size:10px;opacity:.85}
.wrap{padding:7px 10px}
.alertbar{background:#dc2626;color:#fff;padding:4px 14px;font-weight:bold;font-size:13px;display:none}
/* indicadores */
.reunion{background:#0b1626;color:#fff;border-radius:10px;padding:8px 10px;margin-bottom:7px}
.reunion h3{font-size:13px;margin-bottom:6px;display:inline;margin-left:8px;vertical-align:middle}
.rtag{background:#EA580C;color:#fff;font-size:10px;font-weight:bold;padding:2px 9px;border-radius:99px;letter-spacing:1px;vertical-align:middle}
.rgrid{width:100%;border-collapse:separate;border-spacing:5px 0;table-layout:fixed;margin-top:6px}
.rcell{background:#1a2637;border:1px solid #2a3a52;border-radius:8px;padding:6px 9px;vertical-align:top}
.rcell .k{font-size:10px;color:#94a3b8;font-weight:bold;letter-spacing:.5px}
.hl{font-size:9px;letter-spacing:1px;color:#94a3b8;font-weight:bold;display:block;margin-top:3px}
.hvv{font-size:25px;font-weight:bold;color:#fff;line-height:1.05}
.avv{font-size:16px;font-weight:bold;color:#94a3b8}
.bad .hvv{color:#f87171}
.d{margin-top:3px;font-size:10px;color:#94a3b8}
.plan{border-radius:8px;padding:6px 9px;color:#fff;vertical-align:top}
.plan .k{color:#fff;opacity:.9;font-size:10px;font-weight:bold}
.plan .v{font-size:25px;font-weight:bold}
.plan .d{color:#fff;opacity:.92}
/* layout planta */
.floor{background:#fff;border:1px solid #e4e4e7;border-radius:10px;padding:7px 9px}
.ftitle{font-size:12px;color:#374151;margin-bottom:6px}
.frow{width:100%;border-collapse:separate;border-spacing:5px 0;table-layout:fixed;margin-bottom:5px}
.fbox{border:2px solid #e4e4e7;border-radius:9px;padding:5px 8px;background:#fff;vertical-align:top}
.fbox.ok{border-color:#16a34a;background:#f0fdf4}
.fbox.over{border-color:#dc2626;background:#fef2f2}
.fcode{font-weight:bold;font-size:16px;color:#1f2937}
.f5s{display:inline-block;width:12px;height:12px;border-radius:50%;margin-left:7px;vertical-align:middle;border:1px solid rgba(0,0,0,.18)}
.frow2{font-size:12px;padding:2px 0;border-top:1px solid #f1f1f3;overflow:hidden}
.fcli{float:left;color:#1f2937;font-weight:bold;max-width:60%;overflow:hidden;white-space:nowrap}
.fnums{float:right;color:#475569;font-weight:bold;font-size:11px}
.frow2.bad .fnums{color:#dc2626}
.fempty{font-size:10px;color:#a1a1aa;padding:2px 0}
.faisle{text-align:center;font-size:10px;color:#a1a1aa;letter-spacing:3px;border-top:2px dashed #e4e4e7;border-bottom:2px dashed #e4e4e7;padding:2px 0;margin:5px 0}
/* estados */
#loading{text-align:center;padding:80px 20px;font-size:20px;font-weight:bold;color:#71717a}
.staleband{position:fixed;bottom:0;left:0;right:0;background:#dc2626;color:#fff;text-align:center;font-weight:bold;font-size:13px;padding:4px;display:none}
/* TV grande */
@media (min-width:1600px){
  body{font-size:19px}
  .hvv{font-size:44px}.avv{font-size:26px}
  .fcode{font-size:24px}.frow2{font-size:16px}.fnums{font-size:15px}
  .clock{font-size:36px}
}
</style>
</head>
<body>

<div class="hdr">
  <div class="clock" id="clock">--:--</div>
  <div class="nextref" id="nextref">actualiza 07:30 · 10:30 · 13:30 · 16:00</div>
  <div class="tit">CINZIA · Pie de Líne<span class="a">a</span> <span style="font-size:14px;opacity:.8">TV</span></div>
  <div class="sub">DYFSA · estado de la línea en vivo</div>
</div>

<div class="alertbar" id="alertbar"></div>
<div id="loading">Cargando datos de planta…</div>
<div class="wrap" id="wrap" style="display:none"></div>
<div class="staleband" id="staleband">⚠ SIN CONEXIÓN — mostrando últimos datos recibidos</div>

<script>
/* ===== TABLERO TV — 100% ES5, apto para browsers viejos de smart TV ===== */
var DASHBOARD_URL = "https://script.google.com/macros/s/AKfycbwrp8Xipd_NEBnAvqxphejm6kWn4B4EHOGRjzLdGMvXgkhF_Ux9VkMb8-R9nxZi_HQTjg/exec?view=dashboard";
var D = null;

function $(id){ return document.getElementById(id); }
function esc(s){ var d=document.createElement('div'); d.textContent=String(s==null?'':s); return d.innerHTML; }
function num(v,f){ return (v==null?f:v); }

/* --- reloj --- */
function p2(n){ return (n<10?'0':'')+n; }
function tick(){ var n=new Date(); $('clock').innerHTML=p2(n.getHours())+':'+p2(n.getMinutes())+':'+p2(n.getSeconds()); }
setInterval(tick,1000); tick();

/* --- fetch con XHR (sin fetch/async) --- */
function fetchData(){
  var xhr = new XMLHttpRequest();
  xhr.open('GET', DASHBOARD_URL + '&t=' + (new Date()).getTime(), true);
  xhr.timeout = 45000;
  xhr.onreadystatechange = function(){
    if (xhr.readyState !== 4) return;
    var ok = false;
    if (xhr.status >= 200 && xhr.status < 300) {
      try {
        var j = JSON.parse(xhr.responseText);
        if (j && j.ok) {
          D = j; ok = true;
          try { localStorage.setItem('pdl_cache', xhr.responseText); } catch(e){}
          $('staleband').style.display = 'none';
          build();
        }
      } catch(e){}
    }
    if (!ok) onFail();
  };
  xhr.ontimeout = function(){ onFail(); };
  xhr.onerror = function(){ onFail(); };
  try { xhr.send(); } catch(e){ onFail(); }
}
function onFail(){
  if (!D) {
    var c = null;
    try { c = localStorage.getItem('pdl_cache'); } catch(e){}
    if (c) { try { D = JSON.parse(c); build(); } catch(e){} }
  }
  if (D) { $('staleband').style.display = 'block'; }
  else { $('loading').innerHTML = 'No se pudo conectar al backend.<br>Reintenta en 60s…'; setTimeout(fetchData, 60000); }
}

/* --- helpers de datos --- */
function dowOf(fecha){ // fecha 'YYYY-MM-DD' -> día de semana sin parser ISO
  if (!fecha) return 0;
  var p = String(fecha).split('-');
  if (p.length < 3) return 0;
  return new Date(+p[0], +p[1]-1, +p[2]).getDay();
}
function ncPctOf(horas, operarios, fecha){
  var dow = dowOf(fecha);
  var dispH = Math.round((operarios||0) * (dow===6?300:470) / 60 * 10) / 10;
  return dispH > 0 ? Math.round((horas||0) * 1000 / dispH) / 10 : null;
}
function moNum(mo){ var m = String(mo).match(/(\d{3,6})/); return m ? m[1] : mo; }

/* --- render --- */
function dd2(k, hoy, ayer, det, bad){
  return '<td class="rcell'+(bad?' bad':'')+'"><div class="k">'+k+'</div>'
    + '<span class="hl">HOY</span><div class="hvv">'+hoy+'</div>'
    + '<span class="hl">AYER</span><div class="avv">'+ayer+'</div>'
    + (det?'<div class="d">'+det+'</div>':'') + '</td>';
}

function renderIndicadores(){
  var ef = D.eficiencia || {};
  var ay = D.ayer || {};
  var cs = D.cinco_s_hoy || {};
  var ray = ay.rondas_rodrigo || {}, yay = ay.rondas_yance || {};

  var ncPctH = ncPctOf(D.nc_horas_hoy, ef.operarios, D.fecha_hoy);
  var ncPctA = ncPctOf(ay.nc_horas, ay.operarios, ay.fecha);
  var efH = num(D.eficiencia_hoy_pct,'—'), efA = num(ay.eficiencia_pct,'—');
  var hospH = num(D.hospital_count,0), hospA = (ay.hospital_personas||[]).length;
  var ausH = (D.ausentes||[]).length, ausA = num(ay.ausentes_count,0);

  var hospMos = [];
  var hm = D.hospital_mos || [];
  for (var i=0;i<hm.length;i++) hospMos.push(moNum(hm[i].mo));
  var ausNames = [];
  var au = D.ausentes || [];
  for (var j=0;j<au.length && j<6;j++) ausNames.push(esc(String(au[j].nombre||'').split(' ')[0]));
  var ncMon = [];
  var nm = D.nc_por_montaje || [];
  for (var k=0;k<nm.length && k<3;k++) ncMon.push(esc(nm[k].montaje)+' '+nm[k].pct+'%');

  var h = '<div class="reunion">'
    + '<span class="rtag">REUNIÓN 11 AM</span>'
    + '<h3 style="margin-top:8px">Indicadores · HOY vs AYER ('+esc(ay.fecha||'—')+')</h3>'
    + '<table class="rgrid"><tr>'
    + dd2('EFICIENCIA PARCIAL', efH+'%', efA+'%', 'prom. mes '+num(D.eficiencia_mes_pct,0)+'% ('+num(D.eficiencia_mes_dias,0)+' días)', false)
    + dd2('NO CONFORMIDAD', num(D.nc_horas_hoy,0)+'h · '+(ncPctH==null?'—':ncPctH+'%'), num(ay.nc_horas,0)+'h · '+(ncPctA==null?'—':ncPctA+'%'), ncMon.join(' · '), ncPctH!=null && ncPctH>10)
    + dd2('GENTE EN HOSPITAL', hospH+' p', hospA+' p', hospMos.length?('hoy: '+esc(hospMos.join(' · '))):'', hospH>num(D.hospital_target,2))
    + dd2('GENTE AUSENTE', ausH+' p', ausA+' p', ausH?('hoy: '+ausNames.join(' · ')):'✓ sin ausentes hoy', false)
    + '</tr></table>'
    + '<table class="rgrid" style="margin-top:5px"><tr>'
    + (function(){
        var tc = taktCounts();
        return '<td class="rcell" style="width:16%"><div class="k">MONTAJES vs TAKT (3d)</div>'
          + '<div style="font-size:22px;font-weight:bold;margin-top:2px;color:#fff">'
          + '<span style="color:#4ade80">'+tc.verdes+' V</span> · <span style="color:#f87171">'+tc.rojos+' R</span></div>'
          + '<div class="d">verde en ritmo · rojo pasado</div></td>';
      })()
    + '<td class="rcell" style="width:32%"><div class="k">5S HOY TEMPRANO</div><div style="font-size:14px;font-weight:bold;margin-top:2px;color:#fff">'
      + (cs.hora?cs.hora+' · ':'') + num(cs.sectores_ok,0)+'/'+num(cs.sectores_total,9)+' OK · '
      + '<span style="color:#4ade80">V '+num(cs.verdes,0)+'</span> <span style="color:#60a5fa">A '+num(cs.amarillos,0)+'</span> <span style="color:#f87171">R '+num(cs.rojos,0)+'</span></div>'
      + '<div class="d">'+(((cs.pendientes||[]).length)?('Pendientes: '+esc(cs.pendientes.join(' · '))):'Todos relevados ✓')+'</div></td>'
    + '<td class="rcell"><div class="k">RONDAS AYER (validadas)</div><div style="font-size:14px;font-weight:bold;margin-top:2px;color:#fff">Y '+num(yay.validadas,0)+'/'+num(yay.total,0)+' · R '+num(ray.validadas,0)+'/'+num(ray.total,0)+'</div><div class="d">'+((yay.flagged||0)+(ray.flagged||0))+' a revisar</div></td>'
    + (function(){
        var p = D.plan_mes || {};
        var bg = {verde:'#16a34a',amarillo:'#d97706',rojo:'#dc2626',gris:'#475569'}[p.color||'gris'] || '#475569';
        return '<td class="plan" style="background:'+bg+'"><div class="k">CUMPLIMIENTO PLAN · '+esc(String(p.mes||'').toUpperCase())+'</div>'
          + '<div class="v">'+(p.pct==null?'—':p.pct+'%')+'</div>'
          + '<div class="d">'+num(p.done,0)+'/'+num(p.plan,0)+' entreg · '+num(p.enprod,0)+' en prod · '+num(p.dias_trans,0)+'/'+num(p.dias_tot,0)+' días</div></td>';
      })()
    + '</tr></table></div>';
  return h;
}

/* codes que se muestran en el layout (fuente única para cajas y contador) */
var CODES_TOP = ['QC','M7','M6','M5','M3','M0'];
var CODES_BOT = ['M1','M2','S1','S2','M4','S5','S6','S7'];

/* estado del montaje vs takt 3d: 'over' (algún MO pasado), 'ok' (todos en ritmo), '' (sin órdenes) */
function montajeStatus(code){
  var m = null, ms = D.montajes || [];
  for (var i=0;i<ms.length;i++) if (ms[i].code===code) { m = ms[i]; break; }
  var mos = (m && m.mos) || [];
  if (!mos.length) return '';
  for (var j=0;j<mos.length;j++) if ((mos[j].dias_en_produccion||0) > 3) return 'over';
  return 'ok';
}
function taktCounts(){
  var codes = CODES_TOP.concat(CODES_BOT), verdes = 0, rojos = 0;
  for (var i=0;i<codes.length;i++){
    var s = montajeStatus(codes[i]);
    if (s === 'over') rojos++;
    else if (s === 'ok') verdes++;
  }
  return { verdes: verdes, rojos: rojos };
}

function boxFor(code){
  var m = null, ms = D.montajes || [];
  for (var i=0;i<ms.length;i++) if (ms[i].code===code) { m = ms[i]; break; }
  var mos = (m && m.mos) || [];
  var overN = 0, rows = '';
  for (var j=0;j<mos.length;j++){
    var mo = mos[j];
    var d = mo.dias_en_produccion;
    var bad = (d||0) > 3;
    if (bad) overN++;
    var pct = (mo.total>0 ? Math.round((mo.terminadas||0)*100/mo.total) : 0);
    var cli = String(mo.producto||mo.prod||mo.mo||'').replace(/^s?\d+\s*-?\s*/i,'') || '—';
    rows += '<div class="frow2'+(bad?' bad':'')+'"><span class="fcli">'+esc(cli.slice(0,20))+'</span><span class="fnums">'+pct+'% · '+(d==null?'?':d)+'d</span></div>';
  }
  if (!rows) rows = '<div class="fempty">sin órdenes</div>';
  var s5 = '';
  var p5 = (D.cinco_s_hoy && D.cinco_s_hoy.por_montaje && D.cinco_s_hoy.por_montaje[code]) || null;
  var col = p5 ? ({verde:'#16a34a',ok:'#16a34a',amarillo:'#2563eb',azul:'#2563eb',rojo:'#dc2626'}[p5.color]||'#94a3b8') : '#000';
  s5 = '<span class="f5s" style="background:'+col+'"></span>';
  var st = montajeStatus(code); // 'over' rojo · 'ok' verde · '' sin órdenes
  return '<td class="fbox'+(st?' '+st:'')+'"><div class="fcode">'+esc(code)+s5+'</div>'+rows+'</td>';
}

function renderLayout(){
  var top = CODES_TOP, bot = CODES_BOT;
  var h = '<div class="floor"><div class="ftitle">Layout de planta · órdenes activas hoy · <b style="color:#dc2626">rojo = pasada del takt (3 días)</b> · <b style="color:#16a34a">verde = en ritmo</b></div><table class="frow"><tr>';
  for (var i=0;i<top.length;i++) h += boxFor(top[i]);
  h += '</tr></table><div class="faisle">PASILLO DE CIRCULACIÓN</div><table class="frow"><tr>';
  for (var j=0;j<bot.length;j++) h += boxFor(bot[j]);
  h += '</tr></table></div>';
  return h;
}

function build(){
  $('loading').style.display = 'none';
  var ab = $('alertbar');
  if (D.alertas && D.alertas.length) {
    var t = [];
    for (var i=0;i<D.alertas.length;i++) t.push('• ' + (D.alertas[i].msg || D.alertas[i]));
    ab.style.display = 'block'; ab.innerHTML = esc(t.join('   '));
  } else ab.style.display = 'none';
  $('wrap').innerHTML = renderIndicadores() + renderLayout();
  $('wrap').style.display = 'block';
  fitScreen();
}

/* --- auto-ajuste: escala el contenido para que TODO entre en una pantalla --- */
function fitScreen(){
  try{
    document.body.style.zoom = 1;
    var vh = window.innerHeight || document.documentElement.clientHeight;
    var ch = document.documentElement.scrollHeight;
    if (ch > vh) {
      var z = Math.floor(vh / ch * 1000) / 1000;
      if (z < 0.5) z = 0.5;
      document.body.style.zoom = z;
    }
  }catch(e){}
}
window.onresize = function(){ fitScreen(); };

/* --- actualización 4x/día: recarga la página en los horarios fijos --- */
var SLOTS = [[7,30],[10,30],[13,30],[16,0]];
function nextSlot(){
  var n = new Date(), best = null, i, t;
  for (i=0;i<SLOTS.length;i++){
    t = new Date(n.getFullYear(), n.getMonth(), n.getDate(), SLOTS[i][0], SLOTS[i][1], 0);
    if (t.getTime() > n.getTime() + 60000 && (best === null || t.getTime() < best.getTime())) best = t;
  }
  if (best === null) best = new Date(n.getFullYear(), n.getMonth(), n.getDate()+1, SLOTS[0][0], SLOTS[0][1], 0);
  return best;
}
(function(){
  var s = nextSlot();
  var el = $('nextref');
  if (el) el.innerHTML = 'próx. actualización ' + p2(s.getHours()) + ':' + p2(s.getMinutes());
  setTimeout(function(){ try{ window.location.reload(); }catch(e){} }, s.getTime() - (new Date()).getTime());
})();

fetchData();
</script>
</body>
</html>

<!-- ============ PULSO DE CALIDAD TV (DÍA ANTERIOR) — ES5, integrado tras los indicadores ============
     Aditivo: pegar al final de tablero_tv.html. Envuelve renderIndicadores() para sumar una tira
     compacta DPU + Voz del Cliente (ayer). Reutiliza .reunion/.rgrid/.rcell/.hvv/.d. No toca código. -->
<script>
/* Pulso de Calidad (ayer) tras los indicadores en la TV (ES5 puro). */
(function(){
  var CAL_URL='https://script.google.com/macros/s/AKfycbwrp8Xipd_NEBnAvqxphejm6kWn4B4EHOGRjzLdGMvXgkhF_Ux9VkMb8-R9nxZi_HQTjg/exec';
  var CAL=null, F=false, CDATE='';
  function _e(s){ if(typeof esc==='function') return esc(s); var d=document.createElement('div'); d.textContent=String(s==null?'':s); return d.innerHTML; }
  function _pad(n){ return (n<10?'0':'')+n; }
  function ayerStr(){
    try{ if(typeof D!=='undefined' && D && D.ayer && D.ayer.fecha) return D.ayer.fecha; }catch(e){}
    var d=new Date(); d.setDate(d.getDate()-1);
    return d.getFullYear()+'-'+_pad(d.getMonth()+1)+'-'+_pad(d.getDate());
  }
  function dpuCell(title,d){
    if(!d||d.error) return '<td class="rcell"><div class="k">'+title+'</div><div class="d" style="margin-top:4px">sin datos</div></td>';
    var v=d.verde||0,a=d.azul||0,r=d.rojo||0;
    return '<td class="rcell"><div class="k">'+title+'</div>'
      +'<div class="hvv">'+(d.dpu!=null?Number(d.dpu).toFixed(2):'—')+'</div>'
      +'<div class="d">'+(d.defectos||0)+' def · '+(d.vehiculos||0)+' veh insp. · DPU</div>'
      +'<div class="d"><span style="color:#4ade80">Bajo '+v+'</span> · <span style="color:#60a5fa">Normal '+a+'</span> · <span style="color:#f87171">Alto/Crít '+r+'</span></div></td>';
  }
  function vozCell(voz){
    voz=voz||{};
    if(voz.error) return '<td class="rcell"><div class="k">VOZ DEL CLIENTE · RECLAMOS EXT.</div><div class="d" style="margin-top:4px">sin planilla</div></td>';
    var g=voz.por_gravedad||{};
    return '<td class="rcell"><div class="k">VOZ DEL CLIENTE · RECLAMOS EXTERNOS</div>'
      +'<div class="hvv">'+(voz.total||0)+'</div>'
      +'<div class="d">reclamos externos del día anterior</div>'
      +'<div class="d"><span style="color:#f87171">Crít '+(g.rojo||0)+'</span> · <span style="color:#60a5fa">Mayor '+(g.azul||0)+'</span> · <span style="color:#4ade80">Menor '+(g.verde||0)+'</span>'
      +((g.otros||0)?(' · <span style="color:#94a3b8">S/clasif '+g.otros+'</span>'):'')+'</div></td>';
  }
  function renderStrip(){
    var head='<span class="rtag">CALIDAD</span><h3 style="margin-top:8px">Pulso de Calidad · AYER'+(CDATE?(' ('+_e(CDATE)+')'):'')+' · DPU por gravedad + Voz del Cliente</h3>';
    if(CAL==null) return '<div class="reunion" style="margin-top:7px">'+head+'<div class="d" style="padding:5px">cargando…</div></div>';
    if(CAL=='ERR') return '<div class="reunion" style="margin-top:7px">'+head+'<div class="d" style="padding:5px">no se pudo cargar Calidad</div></div>';
    return '<div class="reunion" style="margin-top:7px">'+head
      +'<table class="rgrid" style="margin-top:6px"><tr>'
      +dpuCell('CONTROL FINAL',CAL.dpu_cf)+dpuCell('M4 · INST. ET. 2 Y 3',CAL.dpu_m4)+vozCell(CAL.voz)
      +'</tr></table></div>';
  }
  function refresh(){ try{ if(typeof build==='function') build(); }catch(e){} }
  function fetchCal(){
    if(F) return;
    if(CAL!=null && CAL!='ERR') return;
    F=true; var f=ayerStr(); CDATE=f;
    try{
      var xhr=new XMLHttpRequest();
      xhr.open('GET', CAL_URL+'?view=calidad&desde='+f+'&hasta='+f+'&t='+(new Date()).getTime(), true);
      xhr.timeout=45000;
      xhr.onreadystatechange=function(){
        if(xhr.readyState!==4) return; F=false;
        if(xhr.status>=200 && xhr.status<300){ try{ CAL=JSON.parse(xhr.responseText); }catch(e){ CAL='ERR'; } } else CAL='ERR';
        refresh();
      };
      xhr.ontimeout=function(){ F=false; CAL='ERR'; refresh(); };
      xhr.onerror=function(){ F=false; CAL='ERR'; refresh(); };
      xhr.send();
    }catch(e){ F=false; CAL='ERR'; refresh(); }
  }
  function wrapIndic(){
    if(typeof renderIndicadores==='function' && !renderIndicadores.__cal){
      var o=renderIndicadores;
      renderIndicadores=function(){ return o.apply(this,arguments)+renderStrip(); };
      renderIndicadores.__cal=true;
    }
  }
  function wrapBuild(){
    if(typeof build==='function' && !build.__calI){
      var o=build;
      build=function(){ o.apply(this,arguments); fetchCal(); };
      build.__calI=true;
    }
  }
  function start(){ wrapIndic(); wrapBuild(); fetchCal(); refresh(); }
  if(document.readyState==='complete') start();
  else if(window.addEventListener) window.addEventListener('load', start);
  else window.attachEvent('onload', start);
})();
</script>
<!-- ============ FIN PULSO DE CALIDAD TV ============ -->

<!-- ============ EFICIENCIA POR MONTAJE (HOY/AYER) + INACTIVIDAD GLOBAL — ES5, aditivo ============
     Lee ?view=horaxhora (hoy y con &fecha=ayer) y calcula por montaje, con el MISMO cálculo que la
     EFIC. MONTAJE del hora a hora (`_efMap`): estándar/real, cuenta terminadas + en curso ya pasadas
     del estándar, TOPE 100%. Así los dos tableros coinciden y cubre todos los montajes (QC, OTROS, S).
     Pinta "H xx% A yy%" al lado del código de cada card. La INACTIVIDAD global (huecos >15min / hs en
     planta) va al lado de EFICIENCIA PARCIAL. NO toca el core del tablero. -->
<script>
(function(){
  var HXH_BASE = DASHBOARD_URL.split('?')[0] + '?view=horaxhora';
  var EFH=null, EFA=null, INH=null, INA=null;   // eficiencia por montaje {code:pct} hoy/ayer · inactividad global hoy/ayer (%)

  function _toMin(s){var p=String(s).split(':');return (+p[0])*60+(+p[1]);}
  var _EXCL=['mayer','yance','lopez agustin'];
  function _fold(s){return String(s||'').toLowerCase().replace(/[áàä]/g,'a').replace(/[éèë]/g,'e').replace(/[íìï]/g,'i').replace(/[óòö]/g,'o').replace(/[úùü]/g,'u').replace(/ñ/g,'n').replace(/[^a-z0-9]+/g,' ').replace(/\s+/g,' ').trim();}
  function _excl(nom){var k=_fold(nom);for(var i=0;i<_EXCL.length;i++){var ok=true;_fold(_EXCL[i]).split(' ').forEach(function(t){if(t&&k.indexOf(t)<0)ok=false;});if(ok)return true;}return false;}
  var _FIN={'dylan mansilla':720};
  function _finOp(nom){var k=String(nom||'').toLowerCase().replace(/\s+/g,' ').trim();return _FIN[k]||9999;}
  function _segs(P){return P.sab?[[480,780]]:[[490,720],[780,1020]];}
  function _gaps(o,nowM,SEGS){var iv=[];(o.real||[]).forEach(function(r){var a=_toMin(r.ini),b=_toMin(r.fin);if(b>a)iv.push([a,b]);});iv.sort(function(a,b){return a[0]-b[0];});var ciMin=(o.ci&&/^\d/.test(o.ci))?_toMin(o.ci):0;var lead=Math.max(500,ciMin);var fin=_finOp(o.nom);var gaps=[];SEGS.forEach(function(sg,si){var segEnd=Math.min(sg[1],nowM,fin);if(segEnd<=sg[0])return;var cur=(si===0)?Math.max(sg[0],lead):sg[0];if(cur>=segEnd)return;iv.forEach(function(p){var a=Math.max(p[0],sg[0]),b=Math.min(p[1],segEnd);if(b<=a)return;if(a-cur>15)gaps.push([cur,a]);if(b>cur)cur=b;});if(segEnd-cur>15)gaps.push([cur,segEnd]);});return gaps;}
  function _planta(o,nowM,SEGS){var ciMin=(o.ci&&/^\d/.test(o.ci))?_toMin(o.ci):0;var lead=Math.max(500,ciMin);var fin=_finOp(o.nom);var tot=0;SEGS.forEach(function(sg,si){var segEnd=Math.min(sg[1],nowM,fin);if(segEnd<=sg[0])return;var cur=(si===0)?Math.max(sg[0],lead):sg[0];if(cur<segEnd)tot+=segEnd-cur;});return tot;}
  // eficiencia estándar/real por montaje, tope 100%, cuenta terminadas + en curso pasadas del estándar (no 'curso' ni 'nc')
  function _efMap(P){var m={};(P.grupos||[]).forEach(function(g){var o=0,r=0;(g.mos||[]).forEach(function(mm){(mm.real||[]).forEach(function(t){if(t.e!=='nc'&&t.e!=='curso'){o+=(+t.obj||0);r+=(+t.rmin||0);}});});m[g.code]=r>0?Math.min(100,Math.round(o*100/r)):null;});return m;}
  function _inactPct(P){   // inactividad global = Σ huecos>15min / Σ hs en planta
    var nowM=P.hist?99999:_toMin(P.hora);var SEGS=_segs(P);
    var inact=0,planta=0;
    (P.operarios||[]).forEach(function(o){if(_excl(o.nom))return;if(!(o.real&&o.real.length))return;planta+=_planta(o,nowM,SEGS);_gaps(o,nowM,SEGS).forEach(function(gg){inact+=gg[1]-gg[0];});});
    return planta>0?Math.round(inact*100/planta):null;
  }
  function _ayerStr(){try{if(typeof D!=='undefined'&&D&&D.ayer&&D.ayer.fecha)return D.ayer.fecha;}catch(e){}var d=new Date();d.setDate(d.getDate()-1);return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());}
  function _fetch(fecha,cb){
    try{
      var xhr=new XMLHttpRequest();
      xhr.open('GET',HXH_BASE+(fecha?('&fecha='+fecha):'')+'&t='+(new Date()).getTime(),true);
      xhr.timeout=45000;
      xhr.onreadystatechange=function(){if(xhr.readyState!==4)return;var r=null;if(xhr.status>=200&&xhr.status<300){try{var j=JSON.parse(xhr.responseText);if(j&&j.ok)r={eff:_efMap(j),inact:_inactPct(j)};}catch(e){}}cb(r);};
      xhr.ontimeout=function(){cb(null);};xhr.onerror=function(){cb(null);};
      xhr.send();
    }catch(e){cb(null);}
  }

  function _effCol(v){return v==null?'#a1a1aa':(v>=80?'#16a34a':(v>=70?'#d97706':'#dc2626'));}
  function _inCol(v){return v==null?'#a1a1aa':(v<=1?'#16a34a':(v<=3?'#d97706':'#dc2626'));}
  function _vp(v){return v==null?'—':v+'%';}
  function _inject(){
    // eficiencia por montaje calculada desde el hora a hora (mismo cálculo que EFIC. MONTAJE, tope 100%)
    var EM=EFH||{}, EMA=EFA||{};
    var boxes=document.querySelectorAll('.fbox');
    for(var i=0;i<boxes.length;i++){
      var fc=boxes[i].querySelector('.fcode');if(!fc)continue;
      var old=fc.querySelector('.effha');if(old)fc.removeChild(old);
      var code=(fc.textContent||'').trim();
      var hasH=EM.hasOwnProperty(code), hasA=EMA.hasOwnProperty(code);
      if(!hasH && !hasA) continue;   // montaje sin datos hoy ni ayer
      var h=hasH?EM[code]:null, a=hasA?EMA[code]:null;
      var sp=document.createElement('span');sp.className='effha';
      sp.innerHTML='<span class="ehl">H</span> <span style="color:'+_effCol(h==null?null:h)+'">'+_vp(h==null?null:h)+'</span> <span class="ehl">A</span> <span style="color:'+_effCol(a==null?null:a)+'">'+_vp(a==null?null:a)+'</span>';
      fc.appendChild(sp);
    }
    // inactividad global hoy/ayer al lado de EFICIENCIA PARCIAL
    var cells=document.querySelectorAll('.rcell');
    for(var j=0;j<cells.length;j++){
      var k=cells[j].querySelector('.k');
      if(k && /EFICIENCIA PARCIAL/i.test(k.textContent||'')){
        var oldn=cells[j].querySelector('.inactline');if(oldn)cells[j].removeChild(oldn);
        var dv=document.createElement('div');dv.className='d inactline';
        dv.innerHTML='INACTIVIDAD  hoy <b style="color:'+_inCol(INH)+'">'+_vp(INH)+'</b> · ayer <b style="color:'+_inCol(INA)+'">'+_vp(INA)+'</b>';
        cells[j].appendChild(dv);
        break;
      }
    }
    try{fitScreen();}catch(e){}
  }
  function _refresh(){try{if(typeof build==='function')build();else _inject();}catch(e){}}

  function _start(){
    var st=document.createElement('style');
    st.textContent='.effha{float:right;font-size:12px;font-weight:bold;letter-spacing:.3px}.effha .ehl{color:#a1a1aa;font-weight:normal;font-size:10px}@media(min-width:1600px){.effha{font-size:17px}.effha .ehl{font-size:13px}}';
    document.head.appendChild(st);
    if(typeof build==='function' && !build.__effI){var o=build;build=function(){o.apply(this,arguments);_inject();};build.__effI=true;}
    _fetch(null,function(r){if(r){EFH=r.eff;INH=r.inact;}_refresh();});
    _fetch(_ayerStr(),function(r){if(r){EFA=r.eff;INA=r.inact;}_refresh();});
    _inject();
  }
  if(document.readyState==='complete') _start();
  else if(window.addEventListener) window.addEventListener('load',_start);
  else window.attachEvent('onload',_start);
})();
</script>
<!-- ============ FIN EFICIENCIA POR MONTAJE + INACTIVIDAD GLOBAL ============ -->
